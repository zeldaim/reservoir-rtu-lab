# 관제 서버 앞단 — 터널(cloudflared)이 여기로 보낸다. 인터넷에 노출되는 유일한 입구.
events {}
http {
  # 실제 출발지: Cloudflare 터널은 CF-Connecting-IP 를 붙인다. nginx 는 터널 · 내 PC 에서만 닿으므로
  # 이 헤더를 믿어도 된다 (직접 인터넷에 열면 위조 가능 — 그때는 remote_addr 만 쓸 것)
  map $http_cf_connecting_ip $client { "" $remote_addr; default $http_cf_connecting_ip; }

  # 레이트 리밋 (api-defense-lab 실험과 같은 방식) — 장치는 사건이 몰려도 초당 몇 번이면 충분
  limit_req_zone $client zone=perip:10m rate=60r/m;
  limit_req_status 429;

  log_format main '$client [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;            # 장치 한 번 전송은 8KB 아래 (서버도 따로 검사)

    location /api/ {
      limit_req zone=perip burst=20 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header X-Client-IP $client;
      proxy_read_timeout 120s;           # AI 보고서는 수십 초 걸릴 수 있다
    }
    location = /healthz { proxy_pass http://api:8000; }
    location / { return 404; }           # 그 밖은 아무것도 없다
  }
}
